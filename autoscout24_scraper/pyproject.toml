[project]
name = "carscraper"
version = "0.1.0"
description = "AutoScout24 scraper that exports listings in the Autovit cars.json format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "orjson>=3.10",
]

[project.scripts]
carscraper = "carscraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
